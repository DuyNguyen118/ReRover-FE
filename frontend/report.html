<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReRover - LFS | Report an Item</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/report-styles.css">
    <link rel="stylesheet" href="styles/login.css">
    <link rel="stylesheet" href="components/header.css">
    <link rel="stylesheet" href="components/footer.css">
    <style>
        /* FIXED Toggle Button Styles - Override any conflicting styles */
        .toggle-buttons {
            display: flex;
            gap: 15px; /* Space between buttons */
            justify-content: center;
        }

        .toggle-btn {
            padding: 18px 50px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
            position: relative;
            overflow: hidden;
            min-width: 220px;
            white-space: nowrap;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* INACTIVE state - BLACK background */
        .toggle-btn {
            background-color: #292A32 !important;
            color: #FFFFFF !important;
        }

        /* ACTIVE state - GREEN background */
        .toggle-btn.active {
            background-color: #B9FF66 !important;
            color: #000000 !important;
            box-shadow: 0 4px 15px rgba(185, 255, 102, 0.4) !important;
        }

        /* Shimmer effect */
        .toggle-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .toggle-btn:hover::before {
            left: 100%;
        }

        /* Hover effects */
        .toggle-btn:not(.active):hover {
            background-color: #1a1b21 !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3) !important;
        }

        .toggle-btn.active:hover {
            background-color: #a8e055 !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(185, 255, 102, 0.4) !important;
        }

        /* Status indicator */
        .status-indicator {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            width: 100%;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            box-sizing: border-box;
        }

        .status-indicator.lost {
            background-color: rgba(185, 255, 102, 0.2);
            color: #000000;
            border: 2px solid #B9FF66;
        }

        .status-indicator.found {
            background-color: rgba(185, 255, 102, 0.2);
            color: #000000;
            border: 2px solid #B9FF66;
        }

        @media (max-width: 768px) {
            .toggle-buttons {
                flex-direction: column;
                width: 100%;
                max-width: 400px;
                margin: 0 auto;
            }

            .toggle-btn {
                min-width: auto;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>
    <div id="header"></div>

    <main class="main-content">
        <div class="container">
            <!-- Report Type Toggle -->
            <section class="report-toggle-section">
                <div class="toggle-buttons">
                    <button class="toggle-btn active" data-type="lost" id="lostBtn">
                        Report Lost Item
                    </button>
                    <button class="toggle-btn" data-type="found" id="foundBtn">
                        Report Found Item
                    </button>
                </div>
            </section>

            <!-- Status Indicator -->
            <div class="status-indicator lost" id="statusIndicator">
                📍 Currently reporting: <strong>LOST ITEM</strong>
            </div>

            <!-- Report Form -->
            <section class="report-form-section">
                <div class="form-container">
                    <form id="reportForm" onsubmit="handleReportSubmit(event)">
                        <div class="form-group">
                            <label for="itemName">Name</label>
                            <input type="text" id="itemName" name="itemName" placeholder="Name" required>
                        </div>

                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" name="category" required>
                                <option value="">Select Category</option>
                                <option value="electronics">Electronics</option>
                                <option value="clothing">Clothing</option>
                                <option value="books">Books</option>
                                <option value="accessories">Accessories</option>
                                <option value="documents">Documents</option>
                                <option value="keys">Keys</option>
                                <option value="bags">Bags</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" name="description" placeholder="Please provide a detailed description of the item..." rows="5" required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="location" id="locationLabel">Location</label>
                            <input type="text" id="location" name="location" placeholder="Where was the item lost/found? (e.g., A1, 612)" required>
                        </div>

                        <div class="form-group">
                            <label for="contactInfo">Contact Information</label>
                            <input type="email" id="contactInfo" name="contactInfo" placeholder="Student email" required>
                        </div>

                        <div class="form-group">
                            <label for="itemImage">Image</label>
                            <div class="file-upload-container">
                                <input type="file" id="itemImage" name="itemImage" accept="image/*" onchange="handleFileSelect(event)">
                                <button type="button" class="file-upload-btn" onclick="document.getElementById('itemImage').click()">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                        <polyline points="21,15 16,10 5,21"></polyline>
                                    </svg>
                                    Choose Image
                                </button>
                                <span class="file-name" id="fileName">No file selected</span>
                            </div>
                            <div class="image-preview" id="imagePreview"></div>
                        </div>

                        <div class="form-group">
                            <label for="dateTime">Date & Time</label>
                            <input type="datetime-local" id="dateTime" name="dateTime" required>
                        </div>

                        <div class="form-group">
                            <label for="additionalInfo">Additional Information</label>
                            <textarea id="additionalInfo" name="additionalInfo" placeholder="Any additional details that might help..." rows="3"></textarea>
                        </div>

                        <button type="submit" class="submit-btn" id="submitBtn">
                            <span class="submit-text">Submit Report</span>
                            <div class="loading-spinner" style="display: none;">
                                <div class="spinner"></div>
                            </div>
                        </button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <div id="footer"></div>
    
    <script src="components/header-footer.js"></script>
    <script>
        // Global variables
        let currentReportType = 'lost';
        let selectedFile = null;

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Report page loaded successfully');
            
            // Load header and footer components
            loadComponents();
            
            // Set current date and time
            const now = new Date();
            const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
            document.getElementById('dateTime').value = localDateTime;
            
            // Add event listeners to toggle buttons
            const lostBtn = document.getElementById('lostBtn');
            const foundBtn = document.getElementById('foundBtn');
            
            lostBtn.addEventListener('click', function() {
                console.log('Lost button clicked');
                switchReportType('lost');
            });
            
            foundBtn.addEventListener('click', function() {
                console.log('Found button clicked');
                switchReportType('found');
            });
            
            // Initialize form validation
            initializeFormValidation();
            
            // Initialize with lost type
            switchReportType('lost');
        });

        // Load header and footer components
        async function loadComponents() {
            try {
                // Load header
                const headerResponse = await fetch('components/header.html');
                const headerHtml = await headerResponse.text();
                document.getElementById('header').innerHTML = headerHtml;
                
                // Load footer
                const footerResponse = await fetch('components/footer.html');
                const footerHtml = await footerResponse.text();
                document.getElementById('footer').innerHTML = footerHtml;
                
                console.log('Components loaded successfully');
                
            } catch (error) {
                console.error('Error loading components:', error);
            }
        }

        // Switch between Lost and Found report types
        function switchReportType(type) {
            console.log('Switching to type:', type);
            
            // Update global variable
            currentReportType = type;
            
            // Get elements
            const lostBtn = document.getElementById('lostBtn');
            const foundBtn = document.getElementById('foundBtn');
            const statusIndicator = document.getElementById('statusIndicator');
            const locationLabel = document.getElementById('locationLabel');
            const locationInput = document.getElementById('location');
            const descriptionInput = document.getElementById('description');
            const submitBtn = document.getElementById('submitBtn');
            const submitText = submitBtn.querySelector('.submit-text');
            
            // Remove active class from both buttons
            lostBtn.classList.remove('active');
            foundBtn.classList.remove('active');
            
            // Add active class to selected button and update UI
            if (type === 'lost') {
                lostBtn.classList.add('active');
                statusIndicator.className = 'status-indicator lost';
                statusIndicator.innerHTML = '📍 Currently reporting: <strong>LOST ITEM</strong>';
                locationLabel.textContent = 'Location Lost';
                locationInput.placeholder = 'Where did you lose the item? (e.g., A1, 612)';
                descriptionInput.placeholder = 'Please describe the lost item in detail...';
                if (submitText) submitText.textContent = 'Submit Lost Report';
            } else {
                foundBtn.classList.add('active');
                statusIndicator.className = 'status-indicator found';
                statusIndicator.innerHTML = '📍 Currently reporting: <strong>FOUND ITEM</strong>';
                locationLabel.textContent = 'Location Found';
                locationInput.placeholder = 'Where did you find the item? (e.g., A1, 612)';
                descriptionInput.placeholder = 'Please describe the found item in detail...';
                if (submitText) submitText.textContent = 'Submit Found Report';
            }
            
            console.log('Switched to:', type);
        }

        // Handle file selection
        function handleFileSelect(event) {
            const file = event.target.files[0];
            const fileName = document.getElementById('fileName');
            const imagePreview = document.getElementById('imagePreview');
            
            if (file) {
                selectedFile = file;
                fileName.textContent = file.name;
                
                // Show image preview
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        imagePreview.innerHTML = `<img src="${e.target.result}" alt="Preview" style="max-width: 200px; max-height: 200px; border-radius: 10px; border: 2px solid #ddd;">`;
                    };
                    reader.readAsDataURL(file);
                }
            } else {
                selectedFile = null;
                fileName.textContent = 'No file selected';
                imagePreview.innerHTML = '';
            }
        }

        // Handle form submission
        function handleReportSubmit(event) {
            event.preventDefault();
            
            // Validate all fields
            const form = document.getElementById('reportForm');
            const inputs = form.querySelectorAll('input[required], select[required], textarea[required]');
            let isFormValid = true;
            
            inputs.forEach(input => {
                if (!validateField(input)) {
                    isFormValid = false;
                }
            });
            
            if (!isFormValid) {
                showMessage('Please fix the errors above before submitting.', 'error');
                return;
            }
            
            // Collect form data with proper database mapping
            const formData = new FormData(form);
            const reportData = {
                // Database fields
                status: currentReportType, // Maps to database status field (lost/found)
                item_name: formData.get('itemName'),
                category: formData.get('category'),
                description: formData.get('description'),
                location: formData.get('location'),
                contact_email: formData.get('contactInfo'),
                date_time: formData.get('dateTime'),
                additional_info: formData.get('additionalInfo'),
                image_file: selectedFile,
                
                // Metadata
                created_at: new Date().toISOString(),
                user_id: localStorage.getItem('userToken') || 'anonymous'
            };
            
            console.log('Submitting report data:', reportData);
            
            // Show loading state
            showLoadingState(true);
            
            // Simulate API call to backend
            setTimeout(() => {
                showLoadingState(false);
                
                // Show success message
                showMessage(
                    `${currentReportType === 'lost' ? 'Lost' : 'Found'} item report submitted successfully! ` +
                    `Your report has been added to our database with status: "${currentReportType}".`,
                    'success'
                );
                
                // Reset form
                resetForm();
                
                console.log('Report submitted successfully with status:', currentReportType);
            }, 2000);
        }

        // Form validation functions
        function initializeFormValidation() {
            const form = document.getElementById('reportForm');
            const inputs = form.querySelectorAll('input, select, textarea');
            
            inputs.forEach(input => {
                input.addEventListener('blur', function() {
                    validateField(this);
                });
                
                input.addEventListener('input', function() {
                    clearFieldError(this);
                });
            });
        }

        function validateField(field) {
            const value = field.value.trim();
            let isValid = true;
            let errorMessage = '';
            
            // Required field validation
            if (field.hasAttribute('required') && !value) {
                isValid = false;
                errorMessage = 'This field is required';
            }
            
            // Email validation
            if (field.type === 'email' && value) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(value)) {
                    isValid = false;
                    errorMessage = 'Please enter a valid email address';
                }
            }
            
            // Show/hide error
            if (!isValid) {
                showFieldError(field, errorMessage);
            } else {
                clearFieldError(field);
            }
            
            return isValid;
        }

        function showFieldError(field, message) {
            clearFieldError(field);
            
            field.style.borderColor = '#ff4444';
            
            const errorDiv = document.createElement('div');
            errorDiv.className = 'field-error';
            errorDiv.style.color = '#ff4444';
            errorDiv.style.fontSize = '14px';
            errorDiv.style.marginTop = '5px';
            errorDiv.textContent = message;
            
            field.parentNode.appendChild(errorDiv);
        }

        function clearFieldError(field) {
            field.style.borderColor = '#ddd';
            
            const existingError = field.parentNode.querySelector('.field-error');
            if (existingError) {
                existingError.remove();
            }
        }

        // Reset form to initial state
        function resetForm() {
            const form = document.getElementById('reportForm');
            form.reset();
            
            selectedFile = null;
            document.getElementById('fileName').textContent = 'No file selected';
            document.getElementById('imagePreview').innerHTML = '';
            
            // Reset date/time to current
            const now = new Date();
            const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
            document.getElementById('dateTime').value = localDateTime;
            
            // Reset to lost type
            switchReportType('lost');
        }

        // Show loading state
        function showLoadingState(isLoading) {
            const submitBtn = document.querySelector('.submit-btn');
            const submitText = submitBtn.querySelector('.submit-text');
            const loadingSpinner = submitBtn.querySelector('.loading-spinner');
            
            if (isLoading) {
                submitBtn.disabled = true;
                if (submitText) submitText.style.display = 'none';
                if (loadingSpinner) loadingSpinner.style.display = 'flex';
            } else {
                submitBtn.disabled = false;
                if (submitText) submitText.style.display = 'block';
                if (loadingSpinner) loadingSpinner.style.display = 'none';
            }
        }

        // Show success/error messages
        function showMessage(message, type) {
            // Remove existing messages
            const existingMessages = document.querySelectorAll('.success-message, .error-message');
            existingMessages.forEach(msg => msg.remove());
            
            // Create new message
            const messageDiv = document.createElement('div');
            messageDiv.className = type === 'success' ? 'success-message' : 'error-message';
            messageDiv.textContent = message;
            messageDiv.style.display = 'block';
            
            // Insert at top of form
            const formContainer = document.querySelector('.form-container');
            formContainer.insertBefore(messageDiv, formContainer.firstChild);
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                messageDiv.style.opacity = '0';
                setTimeout(() => {
                    if (messageDiv.parentNode) {
                        messageDiv.remove();
                    }
                }, 300);
            }, 5000);
        }
    </script>
</body>
</html>
