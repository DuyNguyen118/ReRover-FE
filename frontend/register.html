<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReRover - LFS | Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/register.css">
    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/main.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">ReRover - LFS</a>
                <nav>
                    <ul class="nav-links">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="lost.html">Lost</a></li>
                        <li><a href="found.html">Found</a></li>
                        <li><a href="aboutUs.html">About us</a></li>
                    </ul>
                </nav>
                <div class="header-actions">
                    <a href="#report" class="report-btn">Report an Item</a>
                    <button class="profile-btn" onclick="toggleProfile()"></button>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="register-container">
                <div class="register-form-section">
                    <h1>Getting Started</h1>
                    <p class="subtitle">Already got an account? <a href="index.html">Sign In</a></p>
                    
                    <form id="registerForm" onsubmit="handleRegister(event)">
                        <div class="register-form">
                            <div class="form-column">
                                <div class="form-group">
                                    <label for="studentId">Student ID</label>
                                    <input type="text" id="studentId" name="studentId" placeholder="Name" required>
                                </div>
                                
                                <div class="form-group">
                                    <label for="email">Email</label>
                                    <input type="email" id="email" name="email" placeholder="Example: abc@example.com" required>
                                </div>
                                
                                <div class="form-group">
                                    <label for="password">Password</label>
                                    <input type="password" id="password" name="password" placeholder="Password" required>
                                </div>
                                
                                <div class="form-group">
                                    <label for="confirmPassword">Confirm Password</label>
                                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Password" required>
                                </div>
                            </div>
                            
                            <div class="form-column">
                                <div class="form-group">
                                    <label for="fullName">Full name</label>
                                    <input type="text" id="fullName" name="fullName" placeholder="Name" required>
                                </div>
                                
                                <div class="form-group">
                                    <label for="address">Address</label>
                                    <input type="text" id="address" name="address" placeholder="Address" required>
                                </div>
                                
                                <div class="form-group">
                                    <label for="socials">Socials</label>
                                    <input type="text" id="socials" name="socials" placeholder="Link to your socials (ie. Facebook...)">
                                </div>
                                
                                <button type="submit" class="register-btn">Register</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="contact-info">
                    <h3>Contact us:</h3>
                    <div class="contact-details">
                        <p>Email: nnvanh.ityu@gmail.com</p>
                        <p>Phone: 555-567-8901</p>
                        <p>Address: 1234 Main St<br>Moonstone City, Stardust State 12345</p>
                    </div>
                </div>
                
                <div class="newsletter">
                    <input type="email" placeholder="Email" id="newsletterEmail">
                    <button onclick="subscribeNewsletter()">Subscribe to news</button>
                </div>
            </div>
            
            <div class="footer-bottom">
                <p>© 2023 Positivus. All Rights Reserved.</p>
                <a href="#privacy">Privacy Policy</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Additional JavaScript for register page
        function handleRegister(event) {
            event.preventDefault();
            
            const formData = {
                studentId: document.getElementById('studentId').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value,
                fullName: document.getElementById('fullName').value,
                address: document.getElementById('address').value,
                socials: document.getElementById('socials').value
            };
            
            // Validation
            if (!validateRegisterForm(formData)) {
                return;
            }
            
            // Show loading state
            const registerBtn = document.querySelector('.register-btn');
            const originalText = registerBtn.textContent;
            registerBtn.textContent = 'Creating Account...';
            registerBtn.disabled = true;
            
            // Simulate API call
            setTimeout(() => {
                registerBtn.textContent = originalText;
                registerBtn.disabled = false;
                
                // For demo purposes, show success message
                alert('Account created successfully! (This is a demo)');
                
                // In a real app, you would redirect to login or dashboard
                // window.location.href = 'index.html';
            }, 2000);
        }
        
        function validateRegisterForm(data) {
            // Check if all required fields are filled
            if (!data.studentId || !data.email || !data.password || !data.confirmPassword || !data.fullName || !data.address) {
                alert('Please fill in all required fields');
                return false;
            }
            
            // Check if passwords match
            if (data.password !== data.confirmPassword) {
                alert('Passwords do not match');
                return false;
            }
            
            // Check password strength (minimum 6 characters)
            if (data.password.length < 6) {
                alert('Password must be at least 6 characters long');
                return false;
            }
            
            // Check email format
            if (!isValidEmail(data.email)) {
                alert('Please enter a valid email address');
                return false;
            }
            
            return true;
        }
        
        // Real-time password confirmation validation
        document.addEventListener('DOMContentLoaded', function() {
            const passwordField = document.getElementById('password');
            const confirmPasswordField = document.getElementById('confirmPassword');
            
            function checkPasswordMatch() {
                if (confirmPasswordField.value && passwordField.value !== confirmPasswordField.value) {
                    confirmPasswordField.style.borderColor = '#ff4444';
                } else {
                    confirmPasswordField.style.borderColor = '#ddd';
                }
            }
            
            passwordField.addEventListener('input', checkPasswordMatch);
            confirmPasswordField.addEventListener('input', checkPasswordMatch);
        });
    </script>
</body>
</html>
